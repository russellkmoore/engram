name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # PRE-02: nightly eval run at 07:00 UTC to track neuron consumption over time.
    # The eval-suite job below also runs on push + same-repo PRs for fast feedback.
    - cron: "0 7 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler types
        run: npm run types:gen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint blockConcurrencyWhile I/O (STO-10)
        run: npm run lint:blockconcurrency

      # STO-10 negative-fixture assertion: the bad fixture MUST trigger a
      # lint failure. If this step succeeds (lint exits 0 on bad fixture),
      # the linter has regressed and is no longer catching forbidden tokens
      # inside blockConcurrencyWhile blocks.
      - name: Lint blockConcurrencyWhile — negative fixture must fail (STO-10)
        run: |
          if node scripts/lint-blockconcurrency.mjs packages/workspace-do/__fixtures__/bad-blockconcurrency.ts; then
            echo "STO-10 regression: bad fixture did not trigger lint failure"
            exit 1
          fi
          echo "STO-10 negative fixture correctly failed."

      # STO-10 positive-fixture assertion: the good fixture must pass cleanly.
      - name: Lint blockConcurrencyWhile — positive fixture must pass (STO-10)
        run: node scripts/lint-blockconcurrency.mjs packages/workspace-do/__fixtures__/good-blockconcurrency.ts

      - name: Lint wrangler.jsonc (FND-08)
        run: npm run lint:wrangler

      # FND-08 negative-fixture assertion: the bad fixture MUST trigger a
      # lint failure. If this step succeeds (lint exits 0 on bad fixture),
      # the linter has regressed and is no longer catching `new_classes`.
      - name: Lint wrangler.jsonc — negative fixture must fail (FND-08)
        run: |
          if node scripts/lint-wrangler.mjs tests/fixtures/bad-wrangler.jsonc; then
            echo "FND-08 regression: bad fixture did not trigger lint failure"
            exit 1
          fi
          echo "FND-08 negative fixture correctly failed."

      # FND-08 positive-fixture assertion: the good fixture must pass cleanly.
      - name: Lint wrangler.jsonc — positive fixture must pass (FND-08)
        run: node scripts/lint-wrangler.mjs tests/fixtures/good-wrangler.jsonc

      - name: Smoke - wrangler dev (mcp-server) — remote AI binding
        # ENG-23: binding-mode=remote so the smoke exercises the real Workers
        # AI endpoint. Catches AI model ID / quota / endpoint regressions that
        # local-stub bindings silently pass. Requires the same secrets the
        # Test (Vitest) step uses (token must have Workers Scripts:Edit so
        # wrangler can create a temporary preview Worker for the proxy session).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/smoke-wrangler-dev.sh packages/mcp-server/wrangler.jsonc 8787 http remote

      - name: Smoke - wrangler dev (triage-worker) — remote AI binding
        # ENG-23: triage-worker is queue-only (no fetch handler) so the smoke
        # uses boot mode (verify wrangler stays up past the startup window).
        # binding-mode=remote so the AI + Vectorize bindings are real — even
        # in boot mode, wrangler still resolves the bindings at startup, so
        # remote auth is required.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/smoke-wrangler-dev.sh packages/triage-worker/wrangler.jsonc 8788 boot remote

      - name: Smoke - fresh install
        run: bash scripts/smoke-install.sh

      - name: Test (Vitest) — all workspaces
        # ENG-24 fix: triage-worker + mcp-server vitest pools declare AI +
        # Vectorize bindings with `remote: true`. The vitest-pool-workers
        # harness opens a `startRemoteProxySession` at pool startup; that
        # session accepts CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as
        # non-interactive auth (per Cloudflare's CI/CD docs and the GA-since-
        # Sep-2025 remote-bindings feature). Wiring those secrets through the
        # env block here restores full test coverage that was previously
        # scoped to workspace-do only.
        #
        # Required GitHub secrets (set under Settings → Secrets → Actions):
        #   CLOUDFLARE_API_TOKEN  — needs Workers:Edit + Workers AI:Read + Vectorize:Read scopes
        #   CLOUDFLARE_ACCOUNT_ID — the deployment account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not configured."
            echo "::error::Add via Settings → Secrets and variables → Actions. Token needs Workers:Edit + Workers AI:Read + Vectorize:Read scopes."
            exit 1
          fi
          npm test

      # PRE-01 migration audit gate — runs on every push to main and every PR
      # (excluding forks which cannot access repo secrets).
      #
      # Fork-safety: forks cannot read repo secrets, so the audit would "pass"
      # with an empty env and exit code 0 (from the missing-env early return).
      # The explicit fork-safety gate below prevents the step from running at
      # all on fork PRs — the CI report shows "skipped" rather than a spurious
      # pass, which is the correct signal for maintainers reviewing the PR.
      #
      # Required GitHub secrets (set under Settings → Secrets → Actions):
      #   CLOUDFLARE_API_TOKEN     — same token as the Test step (Workers:Read scope sufficient)
      #   CLOUDFLARE_ACCOUNT_ID    — same as above
      #   WORKSPACE_NAMESPACE_ID   — WorkspaceDO namespace ID; see user_setup in 01-01-PLAN.md
      #   ENGRAM_ADMIN_AUDIT_TOKEN — shared secret for /__admin/embedding-audit endpoint
      - name: Migration audit (PRE-01)
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        # Defense-in-depth against indefinite hangs: per-fetch timeouts in the
        # script itself (AbortSignal.timeout 30s per HTTP call) plus this
        # step-level ceiling so a stuck script can't burn an entire job slot.
        # CI run 26998314988 hung for 33 minutes before manual cancel.
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKSPACE_NAMESPACE_ID: ${{ secrets.WORKSPACE_NAMESPACE_ID }}
          ENGRAM_ADMIN_AUDIT_TOKEN: ${{ secrets.ENGRAM_ADMIN_AUDIT_TOKEN }}
          # Account-specific deployed Worker URL — set via GH Actions repo variable.
          # Falls through to the bare workers.dev default in the script when unset;
          # that default only routes when the workers.dev subdomain is enabled on
          # the account, which isn't true here (worker lives at
          # engram-mcp-server.<account>.workers.dev). Forks should set their own.
          ADMIN_WORKER_URL: ${{ vars.ADMIN_WORKER_URL }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::PRE-01 audit: CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::PRE-01 audit: CLOUDFLARE_ACCOUNT_ID missing"
            exit 1
          fi
          if [ -z "${WORKSPACE_NAMESPACE_ID:-}" ]; then
            echo "::error::PRE-01 audit: WORKSPACE_NAMESPACE_ID missing — add as GitHub Actions repo secret (see 01-01-PLAN.md user_setup)"
            exit 1
          fi
          if [ -z "${ENGRAM_ADMIN_AUDIT_TOKEN:-}" ]; then
            echo "::error::PRE-01 audit: ENGRAM_ADMIN_AUDIT_TOKEN missing — set via: wrangler secret put ENGRAM_ADMIN_AUDIT_TOKEN"
            exit 1
          fi
          npm run audit:migration

  # ─────────────────────────────────────────────────────────────────────────────
  # PRE-02 eval-suite: Tiered vitest eval tier (MAX_AI_CALLS=200 ceiling)
  #
  # Fork-safety: fork PRs cannot access CLOUDFLARE_API_TOKEN, so the explicit
  # `if:` gate below prevents the job from running on fork PRs entirely — the
  # CI report shows "skipped" rather than a confusing fail or spurious "no tests
  # found" pass. Threat-model T-01-04 (cost-DoS via malicious PR).
  #
  # NOT in required-for-merge status checks: eval may exceed MAX_AI_CALLS
  # intentionally during corpus development; nightly cadence keeps the regression
  # signal alive without blocking dev velocity. The budget ceiling still enforces
  # a hard stop at call 201.
  #
  # Required GitHub secrets (same as build job):
  #   CLOUDFLARE_API_TOKEN  — Workers AI:Read + Vectorize:Read
  #   CLOUDFLARE_ACCOUNT_ID — deployment account
  # ─────────────────────────────────────────────────────────────────────────────
  eval-suite:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler types
        run: npm run types:gen

      - name: Eval suite (PRE-02)
        # Fail loud on missing CF creds — do NOT silently skip.
        # RESEARCH §Pitfall 2: silent skip = green check = no regression signal.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::EVAL TIER: CLOUDFLARE_API_TOKEN missing — add as GitHub Actions repo secret"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::EVAL TIER: CLOUDFLARE_ACCOUNT_ID missing — add as GitHub Actions repo secret"
            exit 1
          fi
          npm run test:eval -- --reporter=verbose

      - name: Neuron summary (PRE-02, best-effort)
        # continue-on-error: a transient Analytics API outage should not block
        # merge. The in-process counter (eval-budget.setup.ts) is the primary
        # gate; the summary is a secondary post-run report.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run eval:summary
